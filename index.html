const stars=document.querySelector(".stars");

}else{

dot.style.top=(Math.random()*100)+"%";

}
function setupDot(dot){

}

for(let i=0;i<28;i++){
const particle=document.createElement("span");
const type=i%4===0?"floating-heart":i%4===1?"floating-petal":"firefly";
particle.className="drifter "+type;
if(type==="floating-heart")particle.textContent="♡";
const size=type==="floating-heart"?18+Math.random()*15:type==="floating-petal"?8+Math.random()*7:2+Math.random()*3;
particle.style.setProperty("--size",size+"px");
const duration=12+Math.random()*12;
particle.style.setProperty("--duration",duration+"s");
particle.style.setProperty("--delay",(-Math.random()*duration)+"s");
positionDrifter(particle);
ambience.appendChild(particle);
}
}
ambience.addEventListener("animationiteration",event=>{
if(event.animationName==="driftUp")positionDrifter(event.target);
});
drawAmbience();
// The music accents follow playback; the garden keeps moving when paused.
function updatePlaying(){document.body.classList.toggle("playing",!audio.paused&&!audio.ended)}
for(const event of ["play","pause","ended"])audio.addEventListener(event,updatePlaying);


const fireworks=document.querySelector(".fireworks");
const fireworkColors=["#ffc0d9","#ffe0a0","#d3b8ff","#ffb8aa"];
function positionFirework(shell,index){
// Keep most bursts beside the bouquet, with an occasional one high above it.
const x=index===2?40+Math.random()*20:index%2===0?10+Math.random()*14:76+Math.random()*14;
const y=index===2?26+Math.random()*8:30+Math.random()*25;
shell.style.setProperty("--x",x+"%");
shell.style.setProperty("--y",y+"%");
shell.style.setProperty("--color",fireworkColors[Math.floor(Math.random()*fireworkColors.length)]);
}
function drawFireworks(){
fireworks.replaceChildren();
for(let i=0;i<4;i++){
const shell=document.createElement("div");
shell.className="firework";
shell.dataset.index=i;
const duration=6.5+Math.random()*3;
shell.style.setProperty("--duration",duration+"s");
shell.style.setProperty("--delay",(-(duration*.36+i*.65))+"s");
positionFirework(shell,i);
const rocket=document.createElement("span");
rocket.className="firework-rocket";
shell.appendChild(rocket);
for(let j=0;j<40;j++){
const ray=document.createElement("span");
const isHeart=j%5===0;
ray.className=isHeart?"firework-ray firework-heart":"firework-ray";
if(isHeart)ray.textContent=j%10===0?"♡":"♥";
const angle=j*Math.PI*2/40;
const radius=j%2===0?1:.62;
ray.style.setProperty("--dx",Math.cos(angle)*radius);
ray.style.setProperty("--dy",Math.sin(angle)*radius);
shell.appendChild(ray);
}
fireworks.appendChild(shell);
}
}
fireworks.addEventListener("animationiteration",event=>{
if(event.animationName==="fireworkCycle")positionFirework(event.target,Number(event.target.dataset.index));
});
drawFireworks();


const playPause=document.getElementById("playPause"),musicSeek=document.getElementById("musicSeek"),elapsed=document.getElementById("elapsed"),durationLabel=document.getElementById("duration"),musicStatus=document.getElementById("musicStatus");
function formatTime(seconds){if(!Number.isFinite(seconds))return "–:––";const total=Math.floor(seconds);return Math.floor(total/60)+":"+String(total%60).padStart(2,"0")}
function updateProgress(){
const ready=Number.isFinite(audio.duration)&&audio.duration>0;
musicSeek.disabled=!ready;
const progress=ready?audio.currentTime/audio.duration*1000:0;
musicSeek.value=progress;
musicSeek.style.setProperty("--progress",progress/10+"%");
elapsed.textContent=formatTime(audio.currentTime);
durationLabel.textContent=formatTime(audio.duration);
musicSeek.setAttribute("aria-valuetext",formatTime(audio.currentTime)+" de "+formatTime(audio.duration));
}
async function startMusic(){try{await audio.play();musicStatus.textContent=""}catch(error){musicStatus.textContent="Não foi possível tocar. Toque no botão para tentar novamente."}}
playPause.addEventListener("click",()=>{if(audio.paused)startMusic();else audio.pause()});
musicSeek.addEventListener("input",()=>{if(Number.isFinite(audio.duration)){audio.currentTime=Number(musicSeek.value)/1000*audio.duration;updateProgress()}});
for(const event of ["loadedmetadata","durationchange","timeupdate","ended"])audio.addEventListener(event,updateProgress);
audio.addEventListener("error",()=>{musicStatus.textContent="Não foi possível carregar a música."});
for(const event of ["play","pause","ended"])audio.addEventListener(event,()=>{playPause.setAttribute("aria-label",audio.paused?"Tocar música":"Pausar música")});
updateProgress();
const motionToggle=document.getElementById("motionToggle");
let motionPaused=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
try{const saved=localStorage.getItem("garden-motion");if(saved!==null)motionPaused=saved==="paused"}catch(error){}
function updateMotion(){document.body.classList.toggle("motion-paused",motionPaused);motionToggle.textContent=motionPaused?"Ativar animações ✨":"Pausar animações";motionToggle.setAttribute("aria-pressed",String(motionPaused))}
motionToggle.addEventListener("click",()=>{motionPaused=!motionPaused;updateMotion();try{localStorage.setItem("garden-motion",motionPaused?"paused":"active")}catch(error){}});
updateMotion();

document.getElementById("again").addEventListener("click",()=>{draw();drawStars();drawAmbience();drawFireworks();for(const selector of [".wrap",".verse"])document.querySelector(selector).getAnimations().forEach(animation=>animation.currentTime=0);audio.currentTime=0;startMusic()});
</script></body></html>
