<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101322"><title>Um jardim para você</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101322;color:#fff;font-family:Georgia,serif}body{overflow-x:hidden;background:radial-gradient(ellipse at 50% 37%,#33304c 0%,#171a2e 45%,#0b1020 100%)}main{min-height:100svh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:28px 12px 35px;position:relative;isolation:isolate}.stars{position:absolute;inset:0;pointer-events:none;z-index:-1;overflow:hidden}.star{position:absolute;width:var(--size);height:var(--size);border-radius:50%;background:#fff0e8;opacity:.55;box-shadow:0 0 7px #ffe2f488;animation:twinkle var(--duration) ease-in-out infinite;animation-delay:var(--delay)}@keyframes twinkle{0%,100%{opacity:0}45%,55%{opacity:.8}}h1{text-align:center;font-weight:normal;font-size:clamp(25px,5vw,43px);letter-spacing:.02em;margin:0 0 3px;color:#ffe4e7;text-shadow:0 0 22px #f9a6c255}p{text-align:center;color:#dfc8d5;font-size:clamp(14px,2.6vw,18px);margin:5px 0 8px}.scene{transform-origin:50% 85%;width:min(96vw,570px);filter:drop-shadow(0 0 24px #f39bc322);animation:bouquetFloat 7s ease-in-out infinite;animation-delay:3.5s}svg{width:100%;height:auto;display:block;overflow:visible}.flower{transform-box:fill-box;transform-origin:center;animation:bloom 1.7s cubic-bezier(.18,.7,.25,1.1) both;animation-delay:var(--delay)}.stem{stroke-dasharray:300;stroke-dashoffset:300;animation:grow 1.6s ease-out forwards;animation-delay:var(--delay)}.leaf{transform-box:fill-box;transform-origin:bottom center;animation:leafIn 1s ease-out both,leafSway 5s ease-in-out infinite;animation-delay:calc(var(--delay) + .5s),calc(var(--delay) + 1.5s)}.petal{filter:drop-shadow(0 2px 3px #4e193540)}.spark{opacity:.55;animation:glow var(--duration) ease-in-out infinite;animation-delay:var(--delay)}@keyframes bloom{from{opacity:.15;transform:scale(.08) rotate(-15deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes grow{to{stroke-dashoffset:0}}@keyframes leafIn{from{opacity:0;transform:scale(.1)}to{opacity:1;transform:scale(1)}}@keyframes glow{0%,100%{opacity:0}45%,55%{opacity:.95}}.wrap{animation:wrapIn 1.5s ease-out both;animation-delay:2.4s}@keyframes wrapIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}button{border:1px solid #e4b7c28c;background:#ffffff12;color:#ffe3e8;border-radius:999px;padding:12px 22px;font-size:14px;cursor:pointer;margin-top:2px;backdrop-filter:blur(8px)}button:hover{background:#ffffff25}footer{font-size:12px;color:#c5acbc;margin-top:14px;text-align:center}@media(max-width:450px){main{padding:28px 8px}.scene{transform-origin:50% 85%;width:100vw}h1{padding:0 12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}.stem{stroke-dashoffset:0!important}}

.music-panel{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:9px 12px;margin:12px auto 0;padding:14px 16px;border:1px solid #e8b8cf4d;background:#ffffff0b;border-radius:20px;width:min(95vw,460px);backdrop-filter:blur(8px)}.music-title{width:100%;text-align:center;color:#ffe3eb;font-size:16px}.music-title span{color:#cbb4c4;font-size:13px}.music-panel audio{display:block;width:100%;min-width:0;color-scheme:dark}.verse{text-align:center;max-width:480px;margin:0 auto 18px;animation:verseIn 1.8s ease both;animation-delay:3.4s}.verse blockquote{font-size:clamp(17px,3.8vw,23px);font-style:italic;color:#ffe2e8;line-height:1.5;margin:0 0 9px}.verse small{letter-spacing:.12em;color:#cfa8ba;text-transform:uppercase}.verse p{font-size:14px;margin-top:13px}@keyframes verseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@media(max-width:420px){main{padding:22px 10px 30px}.scene{transform-origin:50% 85%;width:100%}.music-panel{padding:12px 10px}.music-title{font-size:14px}}
@media(prefers-reduced-motion:reduce){.flower,.stem,.leaf,.spark,.wrap,.verse,.stars{animation:none!important}.stem{stroke-dashoffset:0!important}}

.flower-sway{animation:flowerSway var(--sway-duration,6s) ease-in-out infinite;animation-delay:calc(var(--delay) + 1.7s)}
@keyframes bouquetFloat{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-15px) rotate(1.5deg)}}
@keyframes flowerSway{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(3px,-3px) rotate(7deg)}75%{transform:translate(-3px,2px) rotate(-7deg)}}
@keyframes leafSway{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}

/* A moonlit garden: slow light, drifting petals and a more expressive bouquet. */
main::before{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at 25% 35%,#cb70a72c,transparent 50%),radial-gradient(ellipse at 78% 55%,#d5aa6630,transparent 45%);animation:aurora 12s ease-in-out infinite alternate}
@keyframes aurora{from{opacity:.45;transform:translateY(-12px)}to{opacity:1;transform:translateY(18px)}}
.ambience{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.drifter{position:absolute;left:var(--left);bottom:-45px;width:var(--size);height:var(--size);opacity:0;animation:driftUp var(--duration) linear infinite;animation-delay:var(--delay);will-change:transform,opacity}
.floating-heart{font:var(--size)/1 Georgia,serif;color:#ffc4d7;text-shadow:0 0 12px #f895c2a0}
.floating-petal{border-radius:80% 12% 75% 20%;background:linear-gradient(135deg,#ffe7d9,#e888b5);box-shadow:0 0 12px #ef9ac54a}
.firefly{border-radius:50%;background:#ffe8b3;box-shadow:0 0 8px 2px #ffe6aa80,0 0 20px #ffcd6980}
@keyframes driftUp{0%{opacity:0;transform:translate3d(0,0,0) rotate(0)}12%{opacity:var(--brightness,.65)}45%{transform:translate3d(var(--drift),-42vh,0) rotate(var(--turn))}80%{opacity:var(--brightness,.65)}100%{opacity:0;transform:translate3d(calc(var(--drift) * -.5),-115vh,0) rotate(calc(var(--turn) * 2))}}
.scene::before{content:"";position:absolute;inset:8% 5% 20%;z-index:-1;border-radius:50%;background:radial-gradient(ellipse,#ed9bba35,transparent 68%);animation:gardenGlow 5s ease-in-out infinite}
@keyframes gardenGlow{0%,100%{opacity:.4;transform:scale(.92)}50%{opacity:1;transform:scale(1.12)}}
.scene{position:relative}
.flower-sway{transform-origin:0 18px}
.verse blockquote{animation:verseGlow 6s ease-in-out infinite}
@keyframes verseGlow{0%,100%{text-shadow:0 0 8px #f5b3cb00}50%{text-shadow:0 0 20px #f5b3cb80}}
.equalizer{display:inline-flex;align-items:center;gap:3px;height:17px;margin-right:7px;vertical-align:middle}
.equalizer i{display:block;width:3px;height:14px;border-radius:3px;background:#f7c0d5;transform:scaleY(.25);animation:musicBar .9s ease-in-out infinite alternate;animation-play-state:paused}
.equalizer i:nth-child(2){animation-delay:-.35s}.equalizer i:nth-child(3){animation-delay:-.6s}.equalizer i:nth-child(4){animation-delay:-.15s}
@keyframes musicBar{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
.playing .equalizer i{animation-play-state:running}
.playing .music-panel{animation:musicGlow 4s ease-in-out infinite}
@keyframes musicGlow{0%,100%{box-shadow:0 0 12px #ef9ac514;border-color:#e8b8cf4d}50%{box-shadow:0 0 30px #ef9ac545;border-color:#f7c0d5a0}}
#again{transition:background .25s,box-shadow .25s,transform .25s}#again:hover{transform:translateY(-2px);box-shadow:0 0 22px #f39bc344}#again:active{transform:scale(.97)}
@media(max-width:450px){.drifter{--brightness:.5}}
@media(prefers-reduced-motion:reduce){.drifter{display:none}main::before{transform:none}.scene{transform:none}}

.fireworks{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.firework{position:absolute;left:var(--x);top:var(--y);--radius:clamp(55px,12vw,135px);animation:fireworkCycle var(--duration) linear infinite;animation-delay:var(--delay);color:var(--color)}
.firework-ray{position:absolute;width:3px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor;opacity:0;animation:fireworkBurst var(--duration) cubic-bezier(.15,.55,.35,1) infinite;animation-delay:var(--delay)}
.firework-rocket{position:absolute;width:2px;height:35px;border-radius:50%;background:linear-gradient(to top,transparent,currentColor);box-shadow:0 -3px 8px currentColor;opacity:0;animation:fireworkLaunch var(--duration) ease-out infinite;animation-delay:var(--delay)}
@keyframes fireworkCycle{0%,100%{opacity:0}1%,99%{opacity:1}}
@keyframes fireworkLaunch{0%{opacity:0;transform:translateY(210px) scaleY(1)}4%{opacity:.8}19%{opacity:1;transform:translateY(0) scaleY(.6)}21%,100%{opacity:0;transform:translateY(-5px) scaleY(0)}}
@keyframes fireworkBurst{0%,20%{opacity:0;transform:translate(0,0) scale(.25)}24%{opacity:.95}48%{opacity:.85;transform:translate(calc(var(--dx) * var(--radius)),calc(var(--dy) * var(--radius))) scale(1)}78%{opacity:0;transform:translate(calc(var(--dx) * var(--radius) * 1.18),calc(var(--dy) * var(--radius) + 45px)) scale(.25)}100%{opacity:0;transform:translate(0,0) scale(.25)}}
@media(prefers-reduced-motion:reduce){.fireworks{display:none}}

.star-bright::before,.star-bright::after{content:"";position:absolute;left:50%;top:50%;background:#fff3e5;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px #ffe6bd99}
.star-bright::before{width:11px;height:1px}.star-bright::after{width:1px;height:11px}
.firework-heart{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:0;background:none;box-shadow:none;font:15px/1 Georgia,serif;text-align:center;text-shadow:0 0 7px currentColor}
</style></head><body><main><div class="stars" aria-hidden="true"></div><div class="ambience" aria-hidden="true"></div><div class="fireworks" aria-hidden="true"></div><section class="music-panel"><div class="music-title"><span class="equalizer" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Evergreen Love <span>· Strings & Heart</span></div><audio id="musicPlayer" controls preload="metadata" aria-label="Evergreen Love — Strings &amp; Heart"><source src="assets/evergreen-love.mp3" type="audio/mpeg">Seu navegador não suporta reprodução de áudio.</audio></section><div class="scene"><svg id="bouquet" viewBox="0 0 520 590" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Buquê com rosas, margaridas e tulipas em tons de rosa, pêssego e creme"><defs><radialGradient id="rose"><stop stop-color="#fff0ef"/><stop offset=".65" stop-color="#f6a2bd"/><stop offset="1" stop-color="#ce5d86"/></radialGradient><radialGradient id="peach"><stop stop-color="#fff7de"/><stop offset=".65" stop-color="#ffcfb5"/><stop offset="1" stop-color="#e98c94"/></radialGradient><radialGradient id="cream"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f4d5c8"/></radialGradient><linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffe5e5"/><stop offset="1" stop-color="#c789a6"/></linearGradient><linearGradient id="green" x1="0" x2="1"><stop stop-color="#527a69"/><stop offset="1" stop-color="#86a18a"/></linearGradient></defs><ellipse cx="260" cy="545" rx="126" ry="17" fill="#000" opacity=".22"/><g id="stems"></g><g id="flowers"></g><g class="wrap"><path d="M115 315 Q260 375 405 315 L326 524 Q260 559 194 524Z" fill="url(#paper)" opacity=".94"/><path d="M115 315 L260 445 L194 524Z" fill="#f8c9d8" opacity=".8"/><path d="M405 315 L260 445 L326 524Z" fill="#e8a7c1" opacity=".65"/><path d="M115 315 Q260 388 405 315" fill="none" stroke="#fff2ee" stroke-width="4" opacity=".8"/><path d="M215 450 Q260 470 305 450" stroke="#a65b81" stroke-width="13" fill="none"/><path d="M258 459 C205 410 181 458 233 475 Q254 475 260 461 C285 410 332 447 287 475 Q270 481 258 459Z" fill="#d77b9e" stroke="#ffe1e4" stroke-width="2"/><path d="M260 464 Q242 493 218 511 M260 464 Q286 500 311 507" fill="none" stroke="#c76b91" stroke-width="13" stroke-linecap="round"/></g><g id="sparkles" aria-hidden="true"></g></svg></div><div class="verse"><blockquote>“Qual o lírio entre os espinhos, tal é a minha querida entre as donzelas.”</blockquote><small>Cânticos 2:2</small><p>Entre tantas flores, você tem um encanto especial. ♡</p></div><button id="again" type="button">Florescer novamente ✨</button><footer>Feito com carinho ♡</footer></main><script>
const NS="http://www.w3.org/2000/svg",stems=document.getElementById("stems"),flowers=document.getElementById("flowers"),sparkles=document.getElementById("sparkles");function el(tag,attrs,parent){let e=document.createElementNS(NS,tag);Object.entries(attrs||{}).forEach(([k,v])=>e.setAttribute(k,v));parent.appendChild(e);return e}
const specs=[ [185,230,39,"rose"],[260,173,47,"rose"],[340,232,41,"peach"],[130,300,32,"daisy"],[395,297,34,"daisy"],[208,315,35,"peach"],[307,310,36,"rose"],[158,172,30,"tulip"],[371,164,32,"tulip"],[260,277,31,"daisy"],[104,249,26,"peach"],[421,242,28,"rose"],[222,111,27,"daisy"],[303,117,29,"peach"]];
function draw(){stems.replaceChildren();flowers.replaceChildren();sparkles.replaceChildren();specs.forEach(([x,y,r,type],i)=>{let delay=(i*.13).toFixed(2)+"s",s=el("path",{d:`M260 454 Q${x+20} ${y+120} ${x} ${y}`,stroke:"url(#green)","stroke-width":i%3===0?5:4,fill:"none","stroke-linecap":"round",class:"stem",style:`--delay:${delay}`},stems);let midX=(x+260)/2,midY=(y+454)/2;el("path",{d:`M${midX} ${midY} q-43 -34 -43 3 q24 22 43 -3`,fill:"#789d7b",class:"leaf",style:`--delay:${delay}`},stems);el("path",{d:`M${midX} ${midY+12} q43 -34 43 3 q-24 22 -43 -3`,fill:"#5f8b75",class:"leaf",style:`--delay:${delay}`},stems);
let g=el("g",{transform:`translate(${x} ${y})`},flowers),sway=el("g",{class:"flower-sway",style:`--delay:${delay};--sway-duration:${4+i%4}s`},g),b=el("g",{class:"flower",style:`--delay:${delay}`},sway);if(type==="tulip"){for(let j=0;j<5;j++){el("ellipse",{cx:(j-2)*r*.25,cy:-r*.12,rx:r*.32,ry:r*.85,fill:j%2?"url(#peach)":"url(#rose)",transform:`rotate(${(j-2)*13} ${(j-2)*r*.25} 0)`,class:"petal"},b)}el("ellipse",{cy:r*.32,rx:r*.6,ry:r*.27,fill:"#e77f9f"},b)}
else{let n=type==="daisy"?11:9;for(let j=0;j<n;j++){el("ellipse",{cx:0,cy:-r*.53,rx:type==="daisy"?r*.23:r*.34,ry:type==="daisy"?r*.54:r*.57,fill:type==="daisy"?"url(#cream)":type==="rose"?"url(#rose)":"url(#peach)",transform:`rotate(${j*360/n})`,class:"petal"},b)}if(type!=="daisy"){for(let j=0;j<6;j++)el("ellipse",{cx:0,cy:-r*.24,rx:r*.23,ry:r*.34,fill:type==="rose"?"#ed8dac":"#ffc4af",transform:`rotate(${j*60+18})`,class:"petal"},b)}el("circle",{r:type==="daisy"?r*.28:r*.24,fill:type==="daisy"?"#e7ba71":"#ffdfd7"},b);el("circle",{r:r*.11,fill:type==="daisy"?"#ad7d42":"#d87598"},b)}
 });for(let i=0;i<46;i++){
const dot=el("circle",{r:i%4===0?3:1.7,fill:i%2?"#ffe5b5":"#ffe2f4",class:"spark"},sparkles);
setupDot(dot);
}}
const stars=document.querySelector(".stars");
function moveDot(dot){
if(dot.localName==="circle"){
dot.setAttribute("cx",35+Math.random()*450);
dot.setAttribute("cy",55+Math.random()*450);
}else{
dot.style.left=(Math.random()*100)+"%";
dot.style.top=(Math.random()*100)+"%";
}
}
function setupDot(dot){
moveDot(dot);
const duration=3+Math.random()*5;
dot.style.setProperty("--duration",duration+"s");
dot.style.setProperty("--delay",(-Math.random()*duration)+"s");
}
function drawStars(){
stars.replaceChildren();
for(let i=0;i<70;i++){
const dot=document.createElement("span");
dot.className=i%8===0?"star star-bright":"star";
dot.style.setProperty("--size",(1.5+Math.random()*2)+"px");
setupDot(dot);
stars.appendChild(dot);
}
}
// Reposition only at the invisible boundary of each twinkle cycle.
for(const layer of [stars,sparkles])layer.addEventListener("animationiteration",event=>{
if(event.animationName==="twinkle"||event.animationName==="glow")moveDot(event.target);
});
drawStars();
draw();
const audio=document.getElementById("musicPlayer");

const ambience=document.querySelector(".ambience");
function positionDrifter(particle){
particle.style.setProperty("--left",(4+Math.random()*92)+"%");
particle.style.setProperty("--drift",(-65+Math.random()*130)+"px");
particle.style.setProperty("--turn",(-70+Math.random()*140)+"deg");
}
function drawAmbience(){
ambience.replaceChildren();
for(let i=0;i<28;i++){
const particle=document.createElement("span");
const type=i%4===0?"floating-heart":i%4===1?"floating-petal":"firefly";
particle.className="drifter "+type;
if(type==="floating-heart")particle.textContent="♡";
const size=type==="floating-heart"?18+Math.random()*15:type==="floating-petal"?8+Math.random()*7:2+Math.random()*3;
particle.style.setProperty("--size",size+"px");
const duration=12+Math.random()*12;
particle.style.setProperty("--duration",duration+"s");
particle.style.setProperty("--delay",(-Math.random()*duration)+"s");
positionDrifter(particle);
ambience.appendChild(particle);
}
}
ambience.addEventListener("animationiteration",event=>{
if(event.animationName==="driftUp")positionDrifter(event.target);
});
drawAmbience();
// The music accents follow playback; the garden keeps moving when paused.
function updatePlaying(){document.body.classList.toggle("playing",!audio.paused&&!audio.ended)}
for(const event of ["play","pause","ended"])audio.addEventListener(event,updatePlaying);


const fireworks=document.querySelector(".fireworks");
const fireworkColors=["#ffc0d9","#ffe0a0","#d3b8ff","#ffb8aa"];
function positionFirework(shell,index){
// Keep most bursts beside the bouquet, with an occasional one high above it.
const x=index===2?40+Math.random()*20:index%2===0?10+Math.random()*14:76+Math.random()*14;
const y=index===2?14+Math.random()*8:22+Math.random()*35;
shell.style.setProperty("--x",x+"%");
shell.style.setProperty("--y",y+"%");
shell.style.setProperty("--color",fireworkColors[Math.floor(Math.random()*fireworkColors.length)]);
}
function drawFireworks(){
fireworks.replaceChildren();
for(let i=0;i<4;i++){
const shell=document.createElement("div");
shell.className="firework";
shell.dataset.index=i;
const duration=6.5+Math.random()*3;
shell.style.setProperty("--duration",duration+"s");
shell.style.setProperty("--delay",(-i*1.8)+"s");
positionFirework(shell,i);
const rocket=document.createElement("span");
rocket.className="firework-rocket";
shell.appendChild(rocket);
for(let j=0;j<40;j++){
const ray=document.createElement("span");
const isHeart=j%5===0;
ray.className=isHeart?"firework-ray firework-heart":"firework-ray";
if(isHeart)ray.textContent=j%10===0?"♡":"♥";
const angle=j*Math.PI*2/40;
const radius=j%2===0?1:.62;
ray.style.setProperty("--dx",Math.cos(angle)*radius);
ray.style.setProperty("--dy",Math.sin(angle)*radius);
shell.appendChild(ray);
}
fireworks.appendChild(shell);
}
}
fireworks.addEventListener("animationiteration",event=>{
if(event.animationName==="fireworkCycle")positionFirework(event.target,Number(event.target.dataset.index));
});
drawFireworks();

document.getElementById("again").addEventListener("click",()=>{draw();drawStars();drawAmbience();drawFireworks();for(const selector of [".wrap",".verse"])document.querySelector(selector).getAnimations().forEach(animation=>animation.currentTime=0);audio.currentTime=0;audio.play().catch(()=>{})});
</script></body></html>
